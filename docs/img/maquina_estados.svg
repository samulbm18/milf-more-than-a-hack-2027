<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <title>Máquina de Markov: estados y transiciones</title>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a46"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1393f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6f9f"/></marker>
    <style>
      .grp { stroke-width: 1.4; }
      .gt { font-size: 14px; font-weight: 700; fill: #1d1d1b; }
      .gs { font-size: 12px; fill: #4a4a46; }
      .st { fill: #ffffff; stroke: #5d5d58; stroke-width: 1.3; }
      .stt { font-size: 14px; font-weight: 700; fill: #1d1d1b; }
      .loop { font-size: 15px; fill: #6d6d68; }
      .adv { stroke: #4a4a46; stroke-width: 1.4; fill: none; marker-end: url(#g); }
      .stop { stroke: #4a4a46; stroke-width: 1.6; fill: none; marker-end: url(#g); }
      .rest { stroke: #2f6f9f; stroke-width: 1.6; fill: none; marker-end: url(#b); }
      .turn { stroke: #a1393f; stroke-width: 2.6; fill: none; marker-end: url(#r); }
      .lab { font-size: 12.5px; fill: #3b3b37; }
      .labr { font-size: 12.5px; fill: #a1393f; font-weight: 600; }
      .labb { font-size: 12.5px; fill: #2f6f9f; font-weight: 600; }
      .leg { font-size: 12.5px; fill: #3b3b37; }
    </style>
  </defs>
  <rect width="1120" height="780" fill="#ffffff"/>

  <!-- Posesión H -->
  <rect class="grp" x="200" y="30" width="580" height="130" rx="12" fill="#eef3fa" stroke="#7d9cc4"/>
  <text class="gt" x="216" y="52">Posesión H</text>
  <text class="gs" x="300" y="52">4 fases (Coxian) · media a priori 3 s · etiqueta H</text>
  <g>
    <rect class="st" x="230" y="86" width="74" height="38" rx="8"/><text class="stt" x="267" y="110" text-anchor="middle">PH1</text><text class="loop" x="267" y="80" text-anchor="middle">↻</text>
    <rect class="st" x="370" y="86" width="74" height="38" rx="8"/><text class="stt" x="407" y="110" text-anchor="middle">PH2</text><text class="loop" x="407" y="80" text-anchor="middle">↻</text>
    <rect class="st" x="510" y="86" width="74" height="38" rx="8"/><text class="stt" x="547" y="110" text-anchor="middle">PH3</text><text class="loop" x="547" y="80" text-anchor="middle">↻</text>
    <rect class="st" x="650" y="86" width="74" height="38" rx="8"/><text class="stt" x="687" y="110" text-anchor="middle">PH4</text><text class="loop" x="687" y="80" text-anchor="middle">↻</text>
    <path class="adv" d="M304,105 H370"/><path class="adv" d="M444,105 H510"/><path class="adv" d="M584,105 H650"/>
  </g>
  <text class="gs" x="490" y="148" text-anchor="middle">cualquier fase puede terminar la posesión (salida temprana); la 4ª solo sale</text>

  <!-- Paradas -->
  <rect class="grp" x="120" y="320" width="340" height="110" rx="12" fill="#f3f3f0" stroke="#9a988f"/>
  <text class="gt" x="136" y="342">Parada corta</text>
  <text class="gs" x="240" y="342">3 fases · ~15 s · etiqueta D</text>
  <rect class="st" x="148" y="370" width="66" height="36" rx="8"/><text class="stt" x="181" y="393" text-anchor="middle">DS1</text>
  <rect class="st" x="258" y="370" width="66" height="36" rx="8"/><text class="stt" x="291" y="393" text-anchor="middle">DS2</text>
  <rect class="st" x="368" y="370" width="66" height="36" rx="8"/><text class="stt" x="401" y="393" text-anchor="middle">DS3</text>
  <path class="adv" d="M214,388 H258"/><path class="adv" d="M324,388 H368"/>

  <rect class="grp" x="520" y="320" width="340" height="110" rx="12" fill="#f3f3f0" stroke="#9a988f"/>
  <text class="gt" x="536" y="342">Parada larga</text>
  <text class="gs" x="636" y="342">3 fases · ~60 s · etiqueta D</text>
  <rect class="st" x="548" y="370" width="66" height="36" rx="8"/><text class="stt" x="581" y="393" text-anchor="middle">DL1</text>
  <rect class="st" x="658" y="370" width="66" height="36" rx="8"/><text class="stt" x="691" y="393" text-anchor="middle">DL2</text>
  <rect class="st" x="768" y="370" width="66" height="36" rx="8"/><text class="stt" x="801" y="393" text-anchor="middle">DL3</text>
  <path class="adv" d="M614,388 H658"/><path class="adv" d="M724,388 H768"/>

  <!-- Posesión A -->
  <rect class="grp" x="200" y="590" width="580" height="130" rx="12" fill="#faf0ee" stroke="#c48c88"/>
  <text class="gt" x="216" y="612">Posesión A</text>
  <text class="gs" x="300" y="612">4 fases (Coxian) · media a priori 3 s · etiqueta A</text>
  <rect class="st" x="230" y="646" width="74" height="38" rx="8"/><text class="stt" x="267" y="670" text-anchor="middle">PA1</text><text class="loop" x="267" y="640" text-anchor="middle">↻</text>
  <rect class="st" x="370" y="646" width="74" height="38" rx="8"/><text class="stt" x="407" y="670" text-anchor="middle">PA2</text><text class="loop" x="407" y="640" text-anchor="middle">↻</text>
  <rect class="st" x="510" y="646" width="74" height="38" rx="8"/><text class="stt" x="547" y="670" text-anchor="middle">PA3</text><text class="loop" x="547" y="640" text-anchor="middle">↻</text>
  <rect class="st" x="650" y="646" width="74" height="38" rx="8"/><text class="stt" x="687" y="670" text-anchor="middle">PA4</text><text class="loop" x="687" y="640" text-anchor="middle">↻</text>
  <path class="adv" d="M304,665 H370"/><path class="adv" d="M444,665 H510"/><path class="adv" d="M584,665 H650"/>
  <text class="gs" x="490" y="708" text-anchor="middle">cualquier fase puede terminar la posesión (salida temprana); la 4ª solo sale</text>

  <!-- PRE -->
  <rect class="grp" x="8" y="346" width="104" height="64" rx="10" fill="#f6f4f8" stroke="#9b8fb0"/>
  <text class="stt" x="60" y="367" text-anchor="middle">PRE</text>
  <text class="gs" x="60" y="383" text-anchor="middle">inicio 2ª parte</text>
  <text class="gs" x="60" y="398" text-anchor="middle">D forzado</text>
  <path class="rest" d="M40,346 V105 H230"/>
  <text class="labb" x="48" y="200">saque H</text><text class="lab" x="48" y="216">u·ρ_H</text>
  <path class="rest" d="M80,410 V665 H230"/>
  <text class="labb" x="88" y="540">saque A</text><text class="lab" x="88" y="556">u·(1−ρ_H)</text>

  <!-- H <-> stoppages -->
  <path class="stop" d="M250,160 V320"/>
  <text class="lab" x="242" y="232" text-anchor="end">se para</text><text class="lab" x="242" y="248" text-anchor="end">ex·δ·κ</text>
  <path class="rest" d="M370,320 V160"/>
  <text class="labb" x="378" y="232">reinicia H</text><text class="lab" x="378" y="248">ex·u·ρ_H</text>
  <path class="stop" d="M600,160 V320"/>
  <text class="lab" x="592" y="232" text-anchor="end">se para</text><text class="lab" x="592" y="248" text-anchor="end">ex·δ·(1−κ)</text>
  <path class="rest" d="M720,320 V160"/>
  <text class="labb" x="728" y="232">reinicia H</text><text class="lab" x="728" y="248">ex·u·ρ_H</text>

  <!-- A <-> stoppages -->
  <path class="stop" d="M250,590 V430"/>
  <text class="lab" x="242" y="502" text-anchor="end">se para</text><text class="lab" x="242" y="518" text-anchor="end">ex·δ·κ</text>
  <path class="rest" d="M370,430 V590"/>
  <text class="labb" x="378" y="502">reinicia A</text><text class="lab" x="378" y="518">ex·u·(1−ρ_H)</text>
  <path class="stop" d="M600,590 V430"/>
  <text class="lab" x="592" y="502" text-anchor="end">se para</text><text class="lab" x="592" y="518" text-anchor="end">ex·δ·(1−κ)</text>
  <path class="rest" d="M720,430 V590"/>
  <text class="labb" x="728" y="502">reinicia A</text><text class="lab" x="728" y="518">ex·u·(1−ρ_H)</text>

  <!-- turnovers (red) -->
  <path class="turn" d="M780,100 H900 V650 H784"/>
  <text class="labr" x="908" y="300">→ PA1</text>
  <text class="lab" x="908" y="318">ex·(1−δ)·g_A</text>
  <path class="turn" d="M780,700 H1010 V60 H784"/>
  <text class="labr" x="1018" y="470">→ PH1</text>
  <text class="lab" x="1018" y="488">ex·(1−δ)·g_H</text>

  <!-- legend -->
  <text class="leg" x="14" y="748"><tspan fill="#a1393f" font-weight="700">rojo</tspan> cambio de posesión · <tspan fill="#2f6f9f" font-weight="700">azul</tspan> reinicio · ↻ se queda en la fase · ex = prob. de salida de la fase · δ = δ₀+(1−δ₀)·dead (balón parado) · κ = 0,8 (corta/larga) · u = ε+(1−ε)·restart</text>
  <text class="leg" x="14" y="768">ρ_H = P(reinicia H) · g_k = exp(2·log(border/media)) riesgo de cambio de la red · 1ª parte: empieza 1/3 en PH1, PA1 o DS1 · 15 estados, 63 aristas</text>
</svg>
