data:
  window_steps: 150        # 30 s at 5 Hz
  folds: 4
  buffer_s: 30
  exclude_public_from_train: true
mask:
  frac: 0.4                # share of really visible graded frames hidden per epoch
  short_extra: 0.2         # extra share of blocks drawn short (0.2-2 s)
  player_dropout: 0.1
aug:
  flip_y: 0.5
  swap_teams: 0.5
  pos_noise_m: [0.2, 0.3]  # players, ball
model:
  d_set: 64
  set_layers: 2
  seeds: 4
  d: 128
  layers: 4
  heads: 4
  ff: 256
  dropout: 0.1
  n_sym: 2          # last-touch owner H/A, live play only (5 = legacy CTRL_H/CTRL_A/LOOSE/DUEL/DEAD)
loss:
  sym: 1.0
  ptr: 0.5
  mdn: 0.2
  border: 0.5
  masked_weight: 2.0
optim:
  lr: 3.0e-4
  wd: 0.01
  epochs: 40
  warmup_epochs: 2
  batch: 32
  windows_per_epoch: 1000
  amp: bf16
  eval_every: 2
